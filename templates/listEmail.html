{{template "main.html" .}}
{{define "body"}}

<h1>Email Templates</h1>
<table class="listTable">
  <tr><th>Event</th><th>Template filename</th><th>Links</th></tr>
  {{range .Templates}}
  <tr>
    <td>{{eventName .EventKey}}</td>
    <td>{{.ShortName}}</td>
    <td>
      <a href="{{makeSendMailLink .}}">Send</a> 
      <a href="{{makeEditMailLink .}}">Edit</a>
    </td>
  </tr>
  {{end}}
</table>

<a href="/editMail?new=true">Create new email template</a>

{{end}}
